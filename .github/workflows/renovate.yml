name: Renovate

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PULSATE_GH_APP_ID }}
          private-key: ${{ secrets.PULSATE_GH_APP_PRIVATE_KEY }}
          repositories: pulsatehq-web-sdk
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-statuses: write
          permission-checks: read
          permission-vulnerability-alerts: read

      - name: Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          renovate-image: ghcr.io/renovatebot/renovate:44.223.1@sha256:4d82316637556d793f1c0e248e003a3842ebadecea0a9f4e9b77c12421da2122
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: PulsateHQ/pulsatehq-web-sdk
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
